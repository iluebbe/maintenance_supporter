name: Tests

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Validate Python syntax
        run: |
          find custom_components/ tests/ -name "*.py" -exec python -m py_compile {} +
          echo "All Python files syntactically valid."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ruff
        # PINNED: an unpinned ruff broke lint on 2026-07-25 (new release made
        # every '# noqa: BLE001' an RUF100 unused-noqa). Keep in sync with the
        # ha-maint container; upgrade deliberately together with a noqa sweep.
        run: pip install ruff==0.15.22
      - name: Ruff check
        run: ruff check custom_components/maintenance_supporter/ tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: npm ci
      # The tsc baseline was cleaned to 0 errors (2026-07): keep it that way.
      - name: Typecheck frontend
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: node esbuild.mjs
      - name: Verify build output
        run: |
          test -f custom_components/maintenance_supporter/frontend/maintenance-panel.js || exit 1
          test -f custom_components/maintenance_supporter/frontend/maintenance-card.js || exit 1

      # Run the frontend unit suite in real Chromium. This is the gate that
      # catches contract bugs like #69 — the ll-custom payload tripwire fires
      # HA's real nested fire-dom-event shape and fails if the handler regresses.
      # Without this step the ~118 web-test-runner tests never gated a PR.
      - name: Install Playwright Chromium
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: npx playwright install --with-deps chromium
      - name: Frontend unit tests
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: npm test

  pytest:
    runs-on: ubuntu-latest
    needs: [syntax-check, lint]
    strategy:
      matrix:
        # HA 2026.7 requires Python >= 3.14.2 — a 3.13 leg silently resolves
        # an OLDER homeassistant via pip's python_requires filtering and then
        # type-checks against stale stubs (bit us on helpers.automation).
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # `holidays` is the Workday integration's own dependency; we install it
        # so the real-`holidays` loop-safety tests (#87) run here instead of
        # skipping (they assert the country calendar is built off the event loop).
        run: pip install pytest pytest-cov pytest-xdist pytest-homeassistant-custom-component mypy babel pypdf holidays
      - name: Type check
        run: mypy custom_components/maintenance_supporter/ --config-file mypy.ini
      # Parallel via pytest-xdist. The old blocker — the documents feature's
      # content-addressed blob dir resolving under pht-cc's *shared* config dir,
      # which let document-writing tests race across workers — is fixed by the
      # conftest `_isolate_document_blobs` fixture (per-test tmp blob root).
      # `--dist loadfile` keeps each test file on one worker; coverage is
      # combined via [tool.coverage.run] parallel=true in pyproject.
      - name: Run tests
        run: pytest tests/ -n auto --dist loadfile --cov=custom_components/maintenance_supporter --cov-report=term-missing --cov-fail-under=98

  docker-smoke:
    name: Docker smoke (HA starts with integration)
    runs-on: ubuntu-latest
    needs: [frontend-build, pytest]
    timeout-minutes: 8
    env:
      HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.7.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The release zip ships the pre-built frontend bundle, so the smoke
      # test must also build it before mounting into the container.
      - name: Build frontend bundle
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: |
          npm ci
          node esbuild.mjs

      - name: Prepare HA config dir
        run: |
          mkdir -p ha-test-config/custom_components
          cp -r custom_components/maintenance_supporter \
            ha-test-config/custom_components/maintenance_supporter
          # Minimal HA config — enough to load the integration without
          # paying the default_config startup tax (which can blow past
          # 180s on a CI runner).
          cat > ha-test-config/configuration.yaml <<'YAML'
          http:
          api:
          frontend:
          websocket_api:
          config:
          panel_custom:
          lovelace:
          recorder:
            db_url: "sqlite:///:memory:"
          logger:
            default: warning
            logs:
              custom_components.maintenance_supporter: debug
              homeassistant.loader: info
              homeassistant.setup: info
          YAML

      - name: Start Home Assistant
        run: |
          docker run -d --name ha-test \
            -v "${GITHUB_WORKSPACE}/ha-test-config:/config" \
            -e TZ=UTC \
            -p 8123:8123 \
            "${HA_IMAGE}"

      - name: Wait for HA API (up to 300s)
        run: |
          for i in $(seq 1 150); do
            if curl -sf http://localhost:8123/manifest.json >/dev/null 2>&1; then
              echo "HA API up after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::HA did not respond within 300s"
          docker logs ha-test --tail 200
          exit 1

      # Integrations with config_flow only are discovered but not set up
      # until an entry exists. Their Python modules are still imported by
      # the loader — that's enough to catch syntax/import/manifest bugs
      # before HACS users hit them.
      - name: Verify integration discovery + module import
        run: |
          # HA puts custom components on its own loader path, not sys.path.
          # PYTHONPATH is set inside the container shell so it survives
          # regardless of host shell path translation (matters for the
          # matching local smoke-test.sh on Windows/git-bash).
          docker exec ha-test sh -c 'PYTHONPATH=/config python -c "
          from custom_components.maintenance_supporter import __init__, config_flow, coordinator
          from custom_components.maintenance_supporter.websocket import __init__ as ws_init
          print(\"OK — all top-level modules import cleanly\")
          "'

      # Business-day scheduling builds a holiday calendar via the `holidays`
      # package when the Workday integration is present (#87). Exercise the
      # real builder inside the shipped HA image — BOTH configs: with a country
      # (Workday sensor configured -> a real calendar) and without (no Workday
      # sensor -> plain Mon-Fri, no holiday import). The off-the-event-loop
      # regression guard for the blocking import lives in the pytest suite
      # (test_workday_business_days); this proves the real package integrates.
      - name: Workday holiday builder works with real holidays (with + without country)
        run: |
          docker exec ha-test pip install --quiet holidays
          docker exec ha-test sh -c 'PYTHONPATH=/config python -c "
          from datetime import date
          from custom_components.maintenance_supporter.helpers.workday import build_provider_from_workday_options as b
          # WITH a Workday sensor (country set): a real holiday calendar is built.
          fn = b({\"country\": \"CA\", \"workdays\": [\"mon\",\"tue\",\"wed\",\"thu\",\"fri\"], \"excludes\": [\"sat\",\"sun\",\"holiday\"]})
          assert fn is not None, \"provider not built with real holidays\"
          assert fn(date(2026, 7, 1)) is False, \"Canada Day (Wed) should not be a business day\"
          assert fn(date(2026, 7, 2)) is True, \"a non-holiday weekday should be a business day\"
          # WITHOUT a Workday sensor (no country): plain Mon-Fri, no holiday import.
          fn2 = b({\"workdays\": [\"mon\",\"tue\",\"wed\",\"thu\",\"fri\"], \"excludes\": [\"sat\",\"sun\"]})
          assert fn2 is not None and fn2(date(2027, 7, 30)) is True and fn2(date(2027, 7, 31)) is False
          print(\"OK — workday builder verified with real holidays (with + without country)\")
          "'

      # Any ERROR or traceback mentioning our integration at startup is a
      # showstopper — this is the exact signal that would have caught
      # a broken release from reaching HACS users.
      - name: Fail on ERROR / Traceback from our integration
        run: |
          if docker logs ha-test 2>&1 \
               | grep -E 'ERROR.*maintenance_supporter|Setup failed for maintenance_supporter|Traceback \(most recent call last\):' \
               | grep -v 'trigger_runtime_hours not configured' \
               > /tmp/ms_errors.log; then
            echo "::error::Integration setup errors detected"
            cat /tmp/ms_errors.log
            echo "--- full HA log (tail 300) ---"
            docker logs ha-test --tail 300
            exit 1
          fi
          echo "No integration setup errors."

      - name: HA log summary (always)
        if: always()
        run: docker logs ha-test --tail 200

      - name: Cleanup
        if: always()
        run: docker rm -f ha-test || true

  # End-to-end lifecycle on the real Maintenance panel (registered custom panel,
  # no lovelace-strategy whenDefined race). Validated green in Docker before
  # wiring here. NON-BLOCKING for the first runs (continue-on-error) so CI Linux
  # confirms stability before it becomes a hard gate; uploads traces on failure.
  e2e-lifecycle:
    name: E2E lifecycle (real HA panel + browser)
    runs-on: ubuntu-latest
    needs: [frontend-build, pytest]
    continue-on-error: true
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build frontend bundle
        working-directory: custom_components/maintenance_supporter/frontend-src
        run: |
          npm ci
          node esbuild.mjs

      - name: Start Home Assistant (onboarding-capable)
        run: |
          mkdir -p ha-e2e-config
          cat > ha-e2e-config/configuration.yaml <<'CFG'
          default_config:
          logger:
            default: warning
          CFG
          docker run -d --name ha-e2e \
            -v "${GITHUB_WORKSPACE}/ha-e2e-config:/config" \
            -v "${GITHUB_WORKSPACE}/custom_components:/config/custom_components:ro" \
            -e TZ=UTC -p 8123:8123 \
            ghcr.io/home-assistant/home-assistant:2026.7.2

      - name: Wait for HA API (up to 300s)
        run: |
          for i in $(seq 1 150); do
            curl -sf http://localhost:8123/manifest.json >/dev/null 2>&1 && { echo "HA up after $((i*2))s"; exit 0; }
            sleep 2
          done
          echo "::error::HA did not start"; docker logs ha-e2e --tail 150; exit 1

      - name: Install E2E deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Headed Chromium under xvfb, NOT headless: the HA frontend never
      # finishes rendering the custom panel in headless-shell on the runner
      # (every beforeEach timed out on "panel should render" — see the
      # 2026-07-05 diagnosis), while the identical spec passes 4/4 in ~19s
      # against the same HA image with a full Chromium (the local
      # run-local.sh setup). xvfb + --headed reproduces that proven setup.
      - name: Run E2E lifecycle (panel)
        working-directory: e2e
        env:
          E2E_HA_URL: http://localhost:8123
        run: xvfb-run --auto-servernum npm test -- specs/lifecycle.spec.ts --headed

      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-lifecycle-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: HA logs (always)
        if: always()
        run: docker logs ha-e2e --tail 150 || true

      - name: Cleanup
        if: always()
        run: docker rm -f ha-e2e || true
