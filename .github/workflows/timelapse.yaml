name: Timelapse

# A year in the life of a household under libfaketime (e2e/timelapse/run.mjs)
# — history, notifications, rotations, phases, fleet learning, buy reminders
# and catalog resets produced by the product's own code paths week by week —
# then moved to a fresh instance and compared value by value
# (e2e/migration/run.mjs). ~12 minutes, so weekly and on demand rather than
# per push; the per-push twins are tests/test_migration_roundtrip.py and the
# migration-roundtrip job.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timelapse:
    name: A year in ten minutes, then moved
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the faketime image
        run: docker build -t ha-faketime -f docker/Dockerfile.ha-faketime docker
      - name: Live a year, then move it
        env:
          TIMELAPSE_IMAGE: ha-faketime
          MIGRATE: "1"
          KEEP: "0"
        run: node e2e/timelapse/run.mjs
      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "=== $c"; docker logs --tail 120 "$c" 2>&1 || true
          done
          if docker ps -q -f name=ms-timelapse | grep -q .; then
            echo "=== inside ms-timelapse"
            docker exec ms-timelapse sh -c 'date; cat /faketime.txt; top -b -n 1 | head -15; netstat -tln 2>/dev/null || ss -tln; wget -qO- -T 5 http://127.0.0.1:8123/manifest.json | head -c 200; echo' || true
            echo "=== home-assistant.log"
            docker exec ms-timelapse tail -n 150 /config/home-assistant.log || true
          fi
      - name: Summary and snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timelapse
          path: |
            e2e/timelapse/.run/summary.json
            e2e/migration/.run/*.json
          # .run is a hidden folder: without this the globs upload nothing.
          include-hidden-files: true
          retention-days: 14
