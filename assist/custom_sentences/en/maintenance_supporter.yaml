# Assist sentences for Maintenance Supporter (English).
#
# The classic (non-LLM) Assist agent only loads sentences from your HA config
# directory — copy this file to:  config/custom_sentences/en/maintenance_supporter.yaml
# (LLM-based Assist pipelines don't need it: they pick the intents up as tools.)
language: "en"
intents:
  MaintenanceSupporterListTasks:
    data:
      - sentences:
          - "what maintenance is (due|overdue)"
          - "which maintenance [tasks] (are|is) (due|overdue|pending)"
          - "is [there] any maintenance due"
          - "what needs (maintenance|servicing)"
  MaintenanceSupporterCompleteTask:
    data:
      - sentences:
          - "complete [the] [maintenance] [task] {name}"
          - "mark [the] [maintenance] [task] {name} [as] (done|completed)"
          - "I (did|finished) [the] {name}"
  MaintenanceSupporterTaskInstructions:
    data:
      - sentences:
          - "how do I (do|perform) [the] {name}"
          - "(instructions|guidance) for [the] {name}"
          - "what do I need for [the] {name}"
  MaintenanceSupporterTaskDue:
    data:
      - sentences:
          - "when is [the] {name} due"
          - "when do I (need|have) to (do|perform) [the] {name}"
  MaintenanceSupporterSnoozeTask:
    data:
      - sentences:
          - "snooze [the] [maintenance] [task] {name}"
          - "(mute|silence) [the] reminders for [the] {name}"
  MaintenanceSupporterPartStock:
    data:
      - sentences:
          - "how (many|much) {name} (do we have|are left|is left)"
          - "what is the stock of [the] {name}"
lists:
  name:
    wildcard: true
