[mypy]
python_version = 3.14
strict = True
warn_return_any = True
warn_unused_configs = True
; The extra checks Home Assistant core runs on its own strict integrations:
; code that cannot run, an ignore that names no error, an Iterable tested for
; truth (a generator is always true), use of a deprecated API.
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-self, truthy-iterable, deprecated
local_partial_types = True

[mypy-homeassistant.components.websocket_api]
; HA's websocket_api package re-exports websocket_command, async_response,
; ActiveConnection, require_admin, event_message, ... from its submodules
; without an __all__, so strict mode's no_implicit_reexport rejects the
; documented public API. Allowing the re-export for this one third-party
; module keeps our own websocket/ package under full strict checking.
implicit_reexport = True

[mypy-homeassistant.components.http]
; Since HA 2026.8 StaticPathConfig lives in http/server.py and the package
; root re-exports it without __all__; importing from .server would break HA
; 2026.7. Allowing the re-export here beats a per-line ignore that reads as
; unused on the older core.
implicit_reexport = True

[mypy-babel.*]
; Localized weekday names for the calendar event label; babel ships no type
; stubs in the CI type-check env.
ignore_missing_imports = True

[mypy-holidays.*]
; Public-holiday calendars for Workday-aware business days (#83 follow-up).
; The package is the Workday integration's dependency - present in a full HA
; runtime, absent in the CI type-check env.
ignore_missing_imports = True


